name: wavelet_m3_t4
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: WHT3H
    type: PairedImageDataset
    dataroot_gt: datasets/WHT3H/train/gt
    dataroot_lq: datasets/WHT3H/train/noise

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: false
    use_rot: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 10
    prefetch_mode: ~

  val:
    name: WHT3H_val
    type: PairedImageDataset
    dataroot_gt: datasets/WHT3H/val/gt
    dataroot_lq: datasets/WHT3H/val/noise
    io_backend:
      type: disk


# network structures
network_g:
  type: wavelet_m3
  upscale: 1
  in_chans: 3
  img_size: 64
  img_range: 1.
  # embed_dim: 32 # param 2.1M
  embed_dim: 64 # param 6.9M
  # embed_dim: 48 # param 4.2M
  d_state: 16
  depths: [4, 4, 4,4,4,4]
  num_heads: [4,4,4,4,4,4]
  window_size: 16
  inner_rank: 64
  num_tokens: 32
  convffn_kernel_size: 5
  mlp_ratio: 2.



path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: 0.
    betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [ 6000, 10000, 15000, 18000 ]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

# validation settings
val:
  val_freq: !!float 2e4
  save_img: false
  use_image: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
