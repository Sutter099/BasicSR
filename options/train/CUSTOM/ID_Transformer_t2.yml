# General Settings
name: ID_Transformer_t2
model_type: ImageRestorationModel
scale: 1
num_gpu: 1  # set to 0 for CPU mode
manual_seed: 0

datasets:
  train:
    name: hm_tir
    type: PairedImageDataset
    dataroot_gt: datasets/hm_tir/train/gt
    dataroot_lq: datasets/hm_tir/train/noise

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 10
    prefetch_mode: ~

  val:
    name: hm_tir_val
    type: PairedImageDataset
    dataroot_gt: datasets/hm_tir/val/gt
    dataroot_lq: datasets/hm_tir/val/noise
    io_backend:
      type: disk

# Network Settings
network_g:
  type: IDTransformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: 'WithBias'

# Path Settings
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# Training Settings
train:
  optim_g:
    type: Adam
    lr: !!float 3e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: MultiStepLR
    milestones: [ 6000, 10000, 15000, 18000 ]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

# Validation Settings
val:
  val_freq: !!float 2e4
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: false
