# General settings
name: DestripeCycleGAN_v1
model_type: DestripeGANModel
scale: 1
num_gpu: 1
manual_seed: 0
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: PairedImageDataset
    dataroot_gt: datasets/hm_tir/train/gt
    dataroot_lq: datasets/hm_tir/train/noise

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: false
    use_rot: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: PairedImageDataset
    dataroot_gt: datasets/hm_tir/val/gt
    dataroot_lq: datasets/hm_tir/val/noise
    io_backend:
      type: disk


# Network settings
network_g:
  type: MWUNetWrapper
  in_ch: 3
  out_ch: 3

network_d:
  type: MultiScaleDisWrapper
  input_dim: 3
  n_scale: 3
  n_layer: 4
  norm: None
  sn: false

# Path settings
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# Training settings
train:
  optim_g:
    type: Adam
    lr: !!float 3e-4
    betas: [0.5, 0.999]
    weight_decay: !!float 1e-4
  optim_d:
    type: Adam
    lr: !!float 3e-4
    betas: [0.5, 0.999]
    weight_decay: !!float 1e-4

  scheduler:
    type: MultiStepLR
    milestones: [100000, 200000]
    gamma: 0.5

  total_iter: 20000
  warmup_iter: -1  # no warm up

  # SGM settings
  sgm_noise_range: [0.02, 0.12]

  # Losses
  gan_opt:
    type: GANLoss
    gan_type: lsgan
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: 1.0

  hbgm_opt:
    type: HBGMLoss
    loss_weight: 10.0

  stripe_opt:
    type: DreclossStripe
    loss_weight: 100.0

  pixel_opt:
    type: L1Loss
    loss_weight: 10.0

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'relu3_3': 1
    vgg_type: vgg16
    use_input_norm: true
    perceptual_weight: 0.01
    style_weight: 0
    criterion: l2

# Validation settings
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# Logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  visual_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# Dist settings
dist_params:
  backend: nccl
  port: 29500
